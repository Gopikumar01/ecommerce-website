
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Pandexa E-Commerce Store</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        header {
            background: #222;
            color: white;
            padding: 20px;
            text-align: center;
        }

        nav {
            background: #333;
            padding: 12px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 15px;
        }

        .hero {
            text-align: center;
            padding: 60px 20px;
            background: white;
        }

        .hero h1 {
            font-size: 40px;
        }

        .products {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 30px;
            flex-wrap: wrap;
        }

        .product {
            background: white;
            width: 220px;
            padding: 20px;
            text-align: center;
            border-radius: 10px;
        }

        .product img {
            width: 180px;
            height: 150px;
            object-fit: cover;
        }

        button {
            background: #222;
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 5px;
        }

        footer {
            background: #222;
            color: white;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>

<body>

<header>
    <h1>My E-Commerce Store</h1>
    <p>Online Shopping Made Easy</p>
</header>

<nav>
    <a href="#">Home</a>
    <a href="#">Products</a>
    <a href="#">Cart</a>
    <a href="#">Login</a>
</nav>

<section class="hero">
    <h1>Welcome to Our Store</h1>
    <p>Find the best products at affordable prices.</p>
    <button>Shop Now</button>
</section>

<section class="products">

    <div class="product">
        <img src="https://via.placeholder.com/180" alt="Product">
        <h3>Product 1</h3>
        <p>₹999</p>
        <button>Add to Cart</button>
    </div>

    <div class="product">
        <img src="https://via.placeholder.com/180" alt="Product">
        <h3>Product 2</h3>
        <p>₹1499</p>
        <button>Add to Cart</button>
    </div>

    <div class="product">
        <img src="https://via.placeholder.com/180" alt="Product">
        <h3>Product 3</h3>
        <p>₹1999</p>
        <button>Add to Cart</button>
    </div>

</section>

<footer>
    <p>© 2026 My E-Commerce Store</p>
</footer>

</body>
</html>
